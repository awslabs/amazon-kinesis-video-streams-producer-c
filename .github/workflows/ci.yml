  linux-thread-size-check:
    needs: ecr-login
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/ubuntu/ubuntu:22.04_stable
      # Authenticated pull; see ecr-public-login.yml.
      credentials: ${{ fromJSON(needs.ecr-login.outputs.attempt == github.run_attempt && needs.ecr-login.outputs.credentials || '{}') }}

    env:
      DEBIAN_FRONTEND: noninteractive

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git cmake build-essential pkg-config

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Build Repository
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_TEST=TRUE -DKVS_DEFAULT_STACK_SIZE=65536 -DPARALLEL_BUILD=ON
          make -j$(nproc)

      - name: Run tests with expected failure
        run: |
          set +e
          cd build
          ./tst/producer_test --gtest_filter="ProducerClientBasicTest.*"
          TEST_EXIT_CODE=$?

          # 128 (abnormal exit) + 11 (segmentation fault) = 139
          if [ $TEST_EXIT_CODE -ne 139 ]; then
            echo "Unexpected exit code: $TEST_EXIT_CODE"
            exit 1
          fi
          echo "Test exited as expected with code $TEST_EXIT_CODE."
        shell: bash

  cmake-flags-test:
    needs: ecr-login
    runs-on: ubuntu-22.04
    container:
      image: public.ecr.aws/ubuntu/ubuntu:22.04_stable
      # Authenticated pull; see ecr-public-login.yml.
      credentials: ${{ fromJSON(needs.ecr-login.outputs.attempt == github.run_attempt && needs.ecr-login.outputs.credentials || '{}') }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git cmake build-essential pkg-config libssl-dev libcurl4-openssl-dev

      - name: Run CMake Flag Combination Test
        run: |
          ./tst/scripts/test_cmake_flags.sh >> $GITHUB_STEP_SUMMARY
