  #  runs-on: ubuntu-20.04
  #  permissions:
  #    id-token: write
  #    contents: read
  #  env:
  #    CC: clang
  #    CXX: clang++
  #    AWS_KVS_LOG_LEVEL: 2
  #  steps:
