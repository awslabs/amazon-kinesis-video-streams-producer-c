name: Producer C SDK CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

env:
  AWS_KVS_LOG_LEVEL: 7

jobs:
  ecr-login:
    uses: ./.github/workflows/ecr-public-login.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  mac-os-builds:
    strategy:
      matrix:
        compiler:
          - name: Clang
            cc: clang
            cxx: clang++
#          - name: gcc-14
#            cc: gcc-14
#            cxx: g++-14
        cpu:
          - name: Intel
            image: macos-15-intel
          - name: Apple Silicon
            image: macos-15
        openssl:
          - specific-preinstalled
          - from-source
          - deps-off
      fail-fast: false

    name: ${{ matrix.cpu.name }} Mac-${{ matrix.compiler.name }}-${{ matrix.openssl }}
    runs-on: ${{ matrix.cpu.image }}

    permissions:
      id-token: write
      contents: read

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'

      - name: Setup envs for including OpenSSL locally
        if: ${{ matrix.openssl == 'specific-preinstalled' }}
        run: |
          OPENSSL_PATH=$(brew --prefix openssl@3)
          echo "LDFLAGS=-L$OPENSSL_PATH/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$OPENSSL_PATH/include" >> $GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=$OPENSSL_PATH" >> $GITHUB_ENV
          echo "CMAKE_FLAGS_EXTRA=-DLOCAL_CRYPTO_BUILD=ON" >> $GITHUB_ENV

      - name: Set CMake flags for Dependencies=OFF
        if: ${{ matrix.openssl == 'deps-off' }}
        run: |
          brew install googletest
          echo "CMAKE_FLAGS_EXTRA=-DBUILD_DEPENDENCIES=OFF" >> $GITHUB_ENV

      - name: Build repository
        if: ${{ !(matrix.compiler.name == 'gcc-14' && matrix.openssl == 'deps-off') }}
        run: |
          $CC --version
          $CXX --version
          mkdir build && cd build
          cmake .. -DBUILD_TEST=ON -DPARALLEL_BUILD=ON $CMAKE_FLAGS_EXTRA
          make -j

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ !(matrix.compiler.name == 'gcc-14' && matrix.openssl == 'deps-off') }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Run tests
        if: ${{ !(matrix.compiler.name == 'gcc-14' && matrix.openssl == 'deps-off') }}
        working-directory: ./build
        run: |
          ./tst/producer_test

  linux-gcc-code-coverage:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v3
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'
      - name: Build repository
        run: |
          mkdir build && cd build
          cmake .. -DCODE_COVERAGE=TRUE -DBUILD_TEST=TRUE -DBUILD_COMMON_LWS=TRUE -DPARALLEL_BUILD=ON
          make
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Run tests
        run: |
          cd build
          ulimit -c unlimited -S
          timeout --signal=SIGABRT 150m ./tst/producer_test --gtest_break_on_failure
      - name: Code coverage
        run: |
          cd build
          for test_file in $(find cproducer.dir kvsCommonCurl.dir kvsCommonLws.dir -name '*.gcno'); do gcov $test_file; done
          bash <(curl -s https://codecov.io/bash)

  address-sanitizer:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Clone repository
        uses: actions/checkout@v3
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'
      - name: Build repository
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_TEST=TRUE -DADDRESS_SANITIZER=TRUE -DBUILD_COMMON_LWS=TRUE -DPARALLEL_BUILD=ON
          make
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Run tests
        run: |
          cd build
          ulimit -c unlimited -S
          timeout --signal=SIGABRT 150m ./tst/producer_test --gtest_break_on_failure

  undefined-behavior-sanitizer:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Clone repository
        uses: actions/checkout@v3
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.x'
      - name: Build repository
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_TEST=TRUE -DUNDEFINED_BEHAVIOR_SANITIZER=TRUE -DBUILD_COMMON_LWS=TRUE -DPARALLEL_BUILD=ON
          make
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Run tests
        run: |
          cd build
          ulimit -c unlimited -S
          timeout --signal=SIGABRT 150m ./tst/producer_test --gtest_break_on_failure

  # memory-sanitizer:
  #   runs-on: ubuntu-20.04
  #   permissions:
  #     id-token: write
  #     contents: read
  #   env:
  #     CC: clang
